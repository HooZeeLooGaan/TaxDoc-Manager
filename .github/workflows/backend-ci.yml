name: Backend CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'backend/**' # Only trigger if backend files change
      - 'requirements.txt'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'backend/**'
      - 'requirements.txt'

jobs:
  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest
